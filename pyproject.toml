[project]
name = "security-kg"
version = "2.0.0"
description = "Convert 24 security data sources (ATT&CK, CAPEC, CWE, CVE, CPE, D3FEND, ATLAS, CAR, ENGAGE, F3, EPSS, KEV, Vulnrichment, GHSA, Sigma, ExploitDB, MISP Galaxies, LOLBAS, LOLDrivers, Atomic Red Team, NIST 800-53, Nuclei, EUVD, OSV) into Subject-Predicate-Object knowledge-graph triples (Parquet)"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Sougata Bhattacharya" }]
keywords = [
    "knowledge-graph",
    "cybersecurity",
    "threat-intelligence",
    "mitre-attack",
    "capec",
    "cwe",
    "cve",
    "cpe",
    "d3fend",
    "atlas",
    "car",
    "engage",
    "f3",
    "epss",
    "kev",
    "vulnrichment",
    "ghsa",
    "sigma",
    "exploitdb",
    "misp-galaxy",
    "lolbas",
    "loldrivers",
    "atomic-red-team",
    "nist-800-53",
    "nuclei",
    "euvd",
    "osv",
    "stix",
    "triples",
    "parquet",
]
dependencies = [
    "mitreattack-python>=5.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "datasets>=2.14.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["common", "convert", "convert_attack", "convert_atlas", "convert_atomic", "convert_capec", "convert_car", "convert_cpe", "convert_cve", "convert_cwe", "convert_d3fend", "convert_engage", "convert_epss", "convert_euvd", "convert_exploitdb", "convert_f3", "convert_ghsa", "convert_kev", "convert_lolbas", "convert_loldrivers", "convert_misp_galaxy", "convert_nist_800_53", "convert_nuclei", "convert_osv", "convert_sigma", "convert_vulnrichment"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require network access (downloads real ATT&CK data)",
]
testpaths = ["tests"]
pythonpath = ["src"]
